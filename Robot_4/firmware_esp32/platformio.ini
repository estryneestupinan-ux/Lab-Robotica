; SCARA R4 - Firmware del ESP32 (PlatformIO)
;
; Compilar y grabar:   pio run -e featheresp32 -t upload
; Monitor serial:      pio device monitor -e featheresp32
;
; El código compila con el Arduino core 2.x (plataforma espressif32 oficial) y con el
; core 3.x (plataforma pioarduino): main.cpp detecta la versión y usa la API que toca.

[platformio]
default_envs = featheresp32

; Opciones comunes a todas las placas
[env]
framework = arduino
monitor_speed = 115200
; Ver lo que se escribe y mandar '\n' con Enter
monitor_echo = yes
monitor_eol = LF
; Abrir el monitor no reinicia el ESP32 (así no se pierde la pose cero)
monitor_dtr = 0
monitor_rts = 0

; Entorno con el que se grabó el robot (la PCB lleva una ESP32 DevKit V1 con módulo WROOM-32)
[env:featheresp32]
platform = espressif32
board = featheresp32

; Definición genérica de la DevKit V1: también sirve
[env:esp32dev]
platform = espressif32
board = esp32dev
