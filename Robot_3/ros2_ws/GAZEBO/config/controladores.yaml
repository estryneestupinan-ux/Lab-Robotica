# Controladores ros2_control (gz_ros2_control) del SCARA
controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:            # q1, q2 (rotacionales) y d3 (prismatico)
  ros__parameters:
    joints: [eslabon1_joint, eslabon2_joint, prismatico_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05

gripper_controller:        # dedos de la garra
  ros__parameters:
    joints: [garra1_joint, garra2_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
